name: Python Tests

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r continuum/requirements.txt
          pip install pytest pytest-cov

      - name: Syntax check all Python files
        run: |
          python -m compileall -q continuum
          echo "✅ All Python files compile successfully!"

      - name: Run full unit test suite (failures fail the build)
        working-directory: continuum
        run: |
          set +e
          python -m pytest model/ inference/ tokenizer/ conversation/ \
            -v --tb=short --no-header --maxfail=3 > /tmp/pytest_out.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Surface the failure as GitHub annotations (publicly readable)
            tail -120 /tmp/pytest_out.txt | sed 's/^/::error::/'
            exit $rc
          fi

      - name: Verify model forward + state-carry regression
        run: |
          python3 -c "
          import sys, torch
          sys.path.insert(0, '.')
          from continuum.model.model import create_continuum_nano
          model = create_continuum_nano()
          inp = torch.randint(0, 100, (1, 8))
          out = model.forward(inp)
          assert out['logits'].shape == (1, 8, 8000), f'Shape mismatch: {out[\"logits\"].shape}'
          print(f'✅ Model test PASSED: {model.num_params:,} params')
          "

  cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build C++ engine (compile check)
        run: |
          cd continuum.cpp
          make -j2
          ./build/continuum --help >/dev/null
          echo "✅ C++ build PASSED"