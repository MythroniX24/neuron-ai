name: Python Tests

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r continuum/requirements.txt
          pip install pytest pytest-cov

      - name: Syntax check all Python files
        run: |
          python -m compileall -q continuum
          echo "✅ All Python files compile successfully!"

      - name: Run full unit test suite (failures fail the build)
        working-directory: continuum
        run: |
          set +e
          python -m pytest model/ inference/ tokenizer/ conversation/ \
            -q --tb=line --no-header --maxfail=3 > /tmp/pytest_out.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Surface failures as GitHub annotations (publicly readable).
            # GitHub caps annotations at 10, so emit ONLY the FAILED summary
            # lines pytest prints at the end (test name + reason).
            grep '^FAILED' /tmp/pytest_out.txt | sed 's/^/::error::/' | head -10
            # Then re-run the first failing test with a short traceback and
            # emit its TOP frames (outermost = our test/model code first).
            failed=$(grep '^FAILED' /tmp/pytest_out.txt | awk '{print $2}' | head -1)
            if [ -n "$failed" ]; then
              python -m pytest "$failed" -x --tb=short --no-header -q 2>&1 \
                | head -14 | sed 's/^/::error::/'
              # GLT scan cross-check: einsum vs chunked vs sequential (three
              # independent implementations) — tells us WHICH one diverges.
              cd ..
              python - <<'DBG' 2>&1 | head -20 | sed 's/^/::error::/'
import torch
from continuum.training.parallel_scan import (
    glt_sequential_forward, _glt_scan_einsum_with_state,
    _compute_chunked_outer_product_and_scan,
)
torch.manual_seed(0)
B, L, D = 2, 33, 24
r = torch.sigmoid(torch.randn(B, L, D)); Wo = torch.randn(D, D)
k = torch.randn(B, L, D); v = torch.randn(B, L, D); q = torch.randn(B, L, D)
gamma = torch.sigmoid(torch.randn(B, L, D)); iota = torch.sigmoid(torch.randn(B, L, D))
h_e, fs_e = _glt_scan_einsum_with_state(k, v, q, gamma, iota)
h_c, fs_c = _compute_chunked_outer_product_and_scan(k, v, q, gamma, iota, chunk_size=16)
o_s = glt_sequential_forward(k, v, q, gamma, iota, r, Wo)
o_c = r * h_c @ Wo.T
o_e = r * h_e @ Wo.T
print('torch', torch.__version__)
print('h einsum vs chunked :', (h_e - h_c).abs().max().item())
print('fs einsum vs chunked:', (fs_e - fs_c).abs().max().item())
print('o einsum vs sequential:', (o_e - o_s).abs().max().item())
print('o chunked vs sequential:', (o_c - o_s).abs().max().item())
DBG
              cd continuum
            fi
            exit $rc
          fi

      - name: Verify model forward + state-carry regression
        run: |
          python3 -c "
          import sys, torch
          sys.path.insert(0, '.')
          from continuum.model.model import create_continuum_nano
          model = create_continuum_nano()
          inp = torch.randint(0, 100, (1, 8))
          out = model.forward(inp)
          assert out['logits'].shape == (1, 8, 8000), f'Shape mismatch: {out[\"logits\"].shape}'
          print(f'✅ Model test PASSED: {model.num_params:,} params')
          "

  cpp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build C++ engine (compile check)
        run: |
          cd continuum.cpp
          make -j2
          ./build/continuum --help >/dev/null
          echo "✅ C++ build PASSED"